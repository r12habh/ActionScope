[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "actionscope"
version = "1.0.0.dev0"
description = "Local AI review of changes to coding-agent access in GitHub Actions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["click>=8.2", "pyyaml>=6", "model2vec>=0.10,<0.11", "huggingface-hub>=0.30,<2"]

[project.scripts]
actionscope = "actionscope.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "build", "hatchling>=1.25"]

[tool.hatch.build.targets.wheel]
packages = ["src/actionscope"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml", "/CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I"]
