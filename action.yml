name: ActionScope AI Access Review
description: Retrieve cited changes in a coding agent's configured access using local AI
inputs:
  question:
    description: What the reviewer wants to know about agent access
    required: true
  base-ref:
    description: Local base commit to compare against the checked out working tree
    required: true
  download-model:
    description: Allow downloading the pinned model if it is not cached
    default: "false"
outputs:
  report-path:
    description: Text review on this runner
    value: ${{ steps.review.outputs.path }}
runs:
  using: composite
  steps:
    - id: review
      shell: bash
      env:
        QUESTION: ${{ inputs.question }}
        BASE_REF: ${{ inputs.base-ref }}
        DOWNLOAD: ${{ inputs.download-model }}
      run: |
        set -euo pipefail
        work="$(mktemp -d "$RUNNER_TEMP/actionscope.XXXXXXXX")"
        cd "$work"
        python3 -I -m venv env
        env/bin/python -I -m pip install --quiet "$GITHUB_ACTION_PATH"
        options=()
        if [[ "$DOWNLOAD" == true ]]; then options+=(--download-model); fi
        env/bin/actionscope review --repo "$GITHUB_WORKSPACE" --base-ref "$BASE_REF" \
          "${options[@]}" -- "$QUESTION" > review.txt
        printf 'path=%s/review.txt\n' "$work" >> "$GITHUB_OUTPUT"
