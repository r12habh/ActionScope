name: 'ActionScope'
description: 'Map the AWS blast radius of GitHub Actions workflows and AI agent configs'
author: 'Rishabh Singh'

branding:
  icon: 'shield'
  color: 'orange'

inputs:
  path:
    description: 'Path to the repository root to scan'
    required: false
    default: '.'
  fail-on:
    description: 'Fail the action at this risk level; empty keeps the scan report-only'
    required: false
    default: ''
  new-only:
    description: 'Apply fail-on only to findings not already gate-eligible in the baseline'
    required: false
    default: 'false'
  min-confidence:
    description: 'Minimum confidence for blocking findings (high, medium, low)'
    required: false
    default: 'high'
  require-baseline:
    description: 'Fail with exit code 2 when new-only has no exact baseline'
    required: false
    default: 'false'
  output-format:
    description: 'Output format: terminal, json, markdown, or sarif'
    required: false
    default: 'terminal'
  upload-sarif:
    description: 'Upload SARIF results to GitHub Code Scanning'
    required: false
    default: 'false'
  resolve-pins:
    description: 'Resolve unpinned action tags to current SHA via GitHub API'
    required: false
    default: 'false'
  offline:
    description: 'Disable scan-time GitHub and AWS API calls'
    required: false
    default: 'false'
  config:
    description: 'Custom ActionScope risk policy file (default: path/.actionscope.yml)'
    required: false
    default: ''
  save-state:
    description: 'Save scan state for delta comparison in future scans'
    required: false
    default: 'false'
  load-state:
    description: 'Compare against previous scan state for delta reporting'
    required: false
    default: 'false'
  state-artifact-name:
    description: 'Cache key prefix for persisting scan state'
    required: false
    default: 'actionscope-state'
  comment-pr:
    description: 'Post findings as a PR comment (requires pull-requests: write permission)'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub token for PR comments, pin resolution, and external reusable workflow inspection'
    required: false
    default: '${{ github.token }}'
  version:
    description: 'ActionScope version to install (default: latest)'
    required: false
    default: ''

outputs:
  overall-risk:
    description: 'The overall risk level found (critical, high, medium, low, info)'
    value: ${{ steps.scan.outputs.overall-risk }}
  findings-json:
    description: 'JSON string of all findings'
    value: ${{ steps.scan.outputs.findings-json }}
  credential-sources-count:
    description: 'Number of AWS credential sources found'
    value: ${{ steps.scan.outputs.credential-sources-count }}
  coverage-status:
    description: 'Coverage status for the scan (complete or partial)'
    value: ${{ steps.scan.outputs.coverage-status }}
  gate-status:
    description: 'Gate decision (report_only, passed, failed, or not_evaluated)'
    value: ${{ steps.scan.outputs.gate-status }}
  gate-exit-code:
    description: 'Gate exit code (0 pass/report-only, 1 finding failure, 2 not evaluated/error)'
    value: ${{ steps.scan.outputs.gate-exit-code }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.11'

    - name: Install ActionScope
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$INPUT_VERSION" ]; then
          pip install "actionscope==$INPUT_VERSION"
        else
          pip install actionscope
        fi

    - name: Prepare baseline key
      id: baseline
      if: inputs.load-state == 'true' || inputs.new-only == 'true' || inputs.save-state == 'true'
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        REF_NAME: ${{ github.ref_name }}
        COMMIT_SHA: ${{ github.sha }}
      run: |
        if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "pull_request_target" ]; then
          BRANCH="$BASE_REF"
          SHA="$BASE_SHA"
        else
          BRANCH="$REF_NAME"
          SHA="$COMMIT_SHA"
        fi
        BRANCH="${BRANCH//\//-}"
        echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"

    - name: Clear untrusted workspace state
      if: inputs.load-state == 'true' || inputs.new-only == 'true'
      shell: bash
      run: rm -f .actionscope/last_scan.json

    - name: Restore exact default-branch state for pull request
      id: restore-pr
      if: (inputs.load-state == 'true' || inputs.new-only == 'true') && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: .actionscope/last_scan.json
        key: ${{ inputs.state-artifact-name }}-${{ steps.baseline.outputs.branch }}-${{ steps.baseline.outputs.sha }}

    - name: Restore previous state for trusted branch run
      id: restore-branch
      if: (inputs.load-state == 'true' || inputs.new-only == 'true') && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: .actionscope/last_scan.json
        key: ${{ inputs.state-artifact-name }}-${{ steps.baseline.outputs.branch }}-${{ steps.baseline.outputs.sha }}
        restore-keys: |
          ${{ inputs.state-artifact-name }}-${{ steps.baseline.outputs.branch }}-

    - name: Verify restored state
      if: inputs.load-state == 'true' || inputs.new-only == 'true'
      shell: bash
      env:
        RESTORED_KEY: ${{ steps.restore-pr.outputs.cache-matched-key || steps.restore-branch.outputs.cache-matched-key }}
      run: |
        if [ -z "$RESTORED_KEY" ] || [ ! -f .actionscope/last_scan.json ]; then
          rm -f .actionscope/last_scan.json
          echo "::warning::ActionScope: no baseline was restored. New-only gating will be reported as not evaluated."
        fi

    - name: Run ActionScope
      id: scan
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_NEW_ONLY: ${{ inputs.new-only }}
        INPUT_MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        INPUT_REQUIRE_BASELINE: ${{ inputs.require-baseline }}
        INPUT_LOAD_STATE: ${{ inputs.load-state }}
        INPUT_SAVE_STATE: ${{ inputs.save-state }}
        INPUT_OFFLINE: ${{ inputs.offline }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_RESOLVE_PINS: ${{ inputs.resolve-pins }}
        INPUT_OUTPUT_FORMAT: ${{ inputs.output-format }}
        INPUT_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
      run: |
        SCAN_FLAGS=()
        if [ "$INPUT_LOAD_STATE" = "true" ] || [ "$INPUT_NEW_ONLY" = "true" ]; then
          SCAN_FLAGS+=(--load-state)
        fi
        if [ "$INPUT_SAVE_STATE" = "true" ]; then
          SCAN_FLAGS+=(--save-state)
        fi
        if [ "$INPUT_OFFLINE" = "true" ]; then
          SCAN_FLAGS+=(--offline)
          if [ "$INPUT_RESOLVE_PINS" = "true" ]; then
            echo "::warning::ActionScope: resolve-pins was skipped because offline mode disables GitHub API calls."
          fi
        elif [ "$INPUT_RESOLVE_PINS" = "true" ]; then
          SCAN_FLAGS+=(--resolve-pins)
        fi
        if [ -n "$INPUT_CONFIG" ]; then
          SCAN_FLAGS+=(--config "$INPUT_CONFIG")
        fi

        set +e
        actionscope scan "$INPUT_PATH" \
          --output-format json \
          --output-file /tmp/actionscope-results.json \
          "${SCAN_FLAGS[@]}" \
          --no-color 2>/tmp/actionscope-stderr.txt
        SCAN_EXIT=$?
        set -e
        if [ ! -f /tmp/actionscope-results.json ]; then
          echo "ActionScope scan did not produce a JSON report. See stderr:"
          cat /tmp/actionscope-stderr.txt || true
          exit 2
        fi
        if [ "$SCAN_EXIT" -gt 1 ]; then
          echo "ActionScope scan failed. See stderr:"
          cat /tmp/actionscope-stderr.txt || true
          exit "$SCAN_EXIT"
        fi

        if [ -f /tmp/actionscope-results.json ]; then
          GATE_EXIT=$(python3 -c "
        import json
        d = json.load(open('/tmp/actionscope-results.json'))
        print(d.get('gate', {}).get('exit_code', 0))
          ")
          if [ -n "$INPUT_FAIL_ON" ]; then
            GATE_FLAGS=(
              --fail-on "$INPUT_FAIL_ON"
              --min-confidence "$INPUT_MIN_CONFIDENCE"
              --write-back
            )
            if [ "$INPUT_NEW_ONLY" = "true" ]; then
              GATE_FLAGS+=(--new-only)
            fi
            if [ "$INPUT_REQUIRE_BASELINE" = "true" ]; then
              GATE_FLAGS+=(--require-baseline)
            fi
            set +e
            actionscope gate /tmp/actionscope-results.json "${GATE_FLAGS[@]}"
            GATE_EXIT=$?
            set -e
          fi
          echo "$GATE_EXIT" > /tmp/actionscope-gate-exit
          echo "gate-exit-code=$GATE_EXIT" >> "$GITHUB_OUTPUT"

          RISK=$(python3 -c "
        import json
        d = json.load(open('/tmp/actionscope-results.json'))
        print(d.get('overall_risk', 'info'))
          ")
          COUNT=$(python3 -c "
        import json
        d = json.load(open('/tmp/actionscope-results.json'))
        print(d.get('summary', {}).get('credential_sources', 0))
          ")
          COVERAGE=$(python3 -c "
        import json
        d = json.load(open('/tmp/actionscope-results.json'))
        print(d.get('coverage_status', 'complete'))
          ")
          GATE=$(python3 -c "
        import json
        d = json.load(open('/tmp/actionscope-results.json'))
        print(d.get('gate', {}).get('status', 'report_only'))
          ")
          echo "overall-risk=$RISK" >> "$GITHUB_OUTPUT"
          echo "coverage-status=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "gate-status=$GATE" >> "$GITHUB_OUTPUT"
          {
            echo 'findings-json<<JSON_EOF'
            cat /tmp/actionscope-results.json
            # The JSON reporter does not emit a trailing newline; without one
            # here `JSON_EOF` ends up appended to the closing brace, so the
            # runner can't find the delimiter and rejects the output write.
            echo ''
            echo JSON_EOF
          } >> "$GITHUB_OUTPUT"
          echo "credential-sources-count=$COUNT" >> "$GITHUB_OUTPUT"

          if [ "$INPUT_OUTPUT_FORMAT" != "json" ]; then
            if ! actionscope report \
              --from-json /tmp/actionscope-results.json \
              --format "$INPUT_OUTPUT_FORMAT"; then
              echo "::warning::ActionScope: failed to render $INPUT_OUTPUT_FORMAT report"
            fi
          fi

          if [ "$INPUT_UPLOAD_SARIF" = "true" ]; then
            if ! actionscope report \
              --from-json /tmp/actionscope-results.json \
              --format sarif > /tmp/actionscope-results.sarif; then
              rm -f /tmp/actionscope-results.sarif
              echo "::error::ActionScope: failed to render SARIF report"
              exit 2
            fi
          fi
        fi

    - name: Save trusted baseline
      if: inputs.save-state == 'true' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: .actionscope/last_scan.json
        key: ${{ inputs.state-artifact-name }}-${{ steps.baseline.outputs.branch }}-${{ github.sha }}

    - name: Upload SARIF to GitHub Code Scanning
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
      with:
        sarif_file: /tmp/actionscope-results.sarif
        category: actionscope

    - name: Post PR comment
      if: inputs.comment-pr == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        if ! MARKDOWN=$(actionscope report \
          --from-json /tmp/actionscope-results.json \
          --format markdown); then
          echo "::warning::ActionScope: failed to render the PR comment"
          MARKDOWN="ActionScope scan complete. See workflow run for details."
        fi
        gh pr comment "$PR_NUMBER" \
          --body "$MARKDOWN" \
          --edit-last 2>/dev/null || \
        gh pr comment "$PR_NUMBER" \
          --body "$MARKDOWN"

    - name: Evaluate risk policy
      if: inputs.fail-on != '' || steps.scan.outputs.gate-exit-code != '0'
      shell: bash
      run: |
        if [ ! -f /tmp/actionscope-gate-exit ]; then
          echo "ActionScope gate result is missing."
          exit 2
        fi
        exit "$(cat /tmp/actionscope-gate-exit)"
