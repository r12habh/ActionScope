name: AI reviewer
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests
  test:
    name: Tests (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: actionscope review --demo --download-model
      - run: HF_HUB_OFFLINE=1 ACTIONSCOPE_TEST_LOCAL_MODEL=1 pytest
      - run: python -m build
  self-review:
    name: ActionScope Self-Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - id: inspect
        uses: ./
        with:
          question: What access changed for the coding agent?
          base-ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          download-model: "true"
      - name: Verify the review ran
        env:
          REPORT: ${{ steps.inspect.outputs.report-path }}
        run: grep -q '^Base .* vs local working tree$' "$REPORT"
